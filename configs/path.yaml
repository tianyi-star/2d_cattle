# Local data locations. Paths are relative to the repository root unless absolute.
# Point these at the private Ubuntu server. For already background-removed cattle
# folders (96 identities as READY/<id>/*.png), run:
#   sh scripts/prepare_ready.sh /path/to/READY sam

raw_image_dir: data/raw
manifest: data/manifest.csv
pattern_dir: data/patterns
pattern_manifest: data/pattern_manifest.csv
# No-SAM arm: the original frame cropped by the YOLO box.
bbox_crop_dir: data/bbox_crops
bbox_manifest: data/bbox_manifest.csv
output_dir: outputs
config: configs/experiment.yaml
yolo_weights: ""
sam_weights: ""
# SAM variant matching sam_weights: vit_b is the memory-safe default.
# vit_t / tiny_vit need the mobile_sam package (or backend: ultralytics).
sam_model_type: vit_b
# auto | segment_anything | mobile_sam | ultralytics.
sam_backend: auto
# cuda / cpu. Empty autodetects.
sam_device: ""
# Mask cache keyed by image id + detection box, so repeated passes are free.
sam_cache_dir: data/sam_mask_cache
