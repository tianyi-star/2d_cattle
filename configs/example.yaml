# Wiring defaults for the Mutong pipeline.
# Replace these values when an experiment is designed.
# This file records no measured recognition figures.

seed: 0
image_size: 224
# Keep shots >= k_shot + q_query when few-shot training reads the F-ODS manifest.
shots: 8
batch_size: 8
epochs: 1
learning_rate: 0.0001
device: cpu
num_workers: 0
pretrained: false

# Documented default. The few-shot command still requires --branch.
branch: metric
backbone: resnet18
vit_model: vit_tiny_patch16_224
# Ultralytics architecture name. Keep a .yaml suffix so no .pt file is fetched.
yolo_model: yolov8n-cls.yaml
metric_loss: prototypical
n_way: 5
k_shot: 4
q_query: 2
triplet_margin: 0.2

morph_kernel: 5

temperature: 0.2
memory_momentum: 0.9
