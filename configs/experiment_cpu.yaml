# CPU smoke-test settings for the 96-identity pipeline.
# Use configs/experiment.yaml on the GPU server for the paper runs.

seed: 0
image_size: 224
batch_size: 16
epochs: 2
learning_rate: 0.0003
weight_decay: 0.0001
num_workers: 0
embedding_dim: 128
arcface_scale: 32.0
arcface_margin: 0.5
crops:
  - sam
  - bbox
yolo_backbone: csp_small
vit_name: vit_tiny_patch16_224
vit_prune_ratio: 0.25
wang_backbone: resnet18
